name = "soundcloud-worker"
main = "worker.js"
compatibility_date = "2024-10-01"

# SoundCloud-only music worker — deploy needs ZERO required fields.
# client_id is auto-scraped; no secrets required.
#
# Optional KV (rate-limit + cache). To enable:
#   npx wrangler kv:namespace create CACHE_KV
# then uncomment below and paste the printed id.
# [[kv_namespaces]]
# binding = "CACHE_KV"
# id = "REPLACE_WITH_NAMESPACE_ID"

[vars]
MAX_DOWNLOAD_MB = "100"
CACHE_TTL_SECONDS = "300"
UPSTREAM_TIMEOUT_MS = "12000"
RATE_LIMIT_SEARCH = "40"
RATE_LIMIT_MEDIA = "90"
RATE_LIMIT_WINDOW_SEC = "60"
MAX_HLS_SEGMENTS = "1500"
ALLOWED_ORIGINS = "*"

# Optional secrets — set via `wrangler secret put` or Dashboard → Secrets:
#   SOUNDCLOUD_CLIENT_ID (override auto-scrape), API_KEYS (gate /api/v1)
